      EDU_EMBEDDING_MODEL: ${EDU_EMBEDDING_MODEL:-educapilote-embeddinggemma:v1}
      EDU_CLOUD_MODEL: ${EDU_CLOUD_MODEL:-gpt-oss:120b-cloud}
      EDU_AI_DAILY_CALLS: ${EDU_AI_DAILY_CALLS:-200}
    secrets:
    - source: db_ai_router
      target: db_password
    - source: redis_ai-router
      target: redis_password
    - jwt_public_keys
    - rate_key
    - ai_internal_key
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
    - backend
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',
        timeout=8)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
    - ollama-host:${EDU_OLLAMA_HOST_IP:-host-gateway}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  proxy:
    image: nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    restart: unless-stopped
    user: 101:101
    entrypoint:
    - nginx
    - -g
    - daemon off;
    ports:
    - ${EDU_BIND_IP:-127.0.0.1}:${EDU_HTTP_PORT:-18088}:8080
    volumes:
    - ./infra/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
    - edge
    - backend
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.5
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      class-service:
        condition: service_healthy
      curriculum-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      exercise-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      tutor-service:
        condition: service_healthy
      retrieval-service:
        condition: service_healthy
      speech-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      safety-service:
        condition: service_healthy
      ai-router-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/health/live
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  test:
    profiles:
    - test
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: test
    environment:
      EDU_TEST_INTEGRATION: '1'
    secrets:
    - postgres_password
    - db_user
    - db_auth
    - db_safety
    - db_content
    - db_admin
    - db_curriculum
    - db_migrator
    - db_exercise
    - db_assessment
    - db_tutor
    - db_retrieval
    - db_ai_router
    - db_class
    - db_analytics
    - db_speech
    - db_notification
    - automation_keys
    - ai_internal_key
    - jwt_private_key
    - jwt_public_keys
    - pii_keys
    - rate_key
    - redis_auth
    - redis_user
    - redis_safety
    - redis_curriculum
    - redis_content
    - redis_exercise
    - redis_assessment
    - redis_tutor
    - redis_retrieval
    - redis_ai-router
    - redis_class
    - redis_analytics
    - redis_admin
    - redis_speech
    - redis_notification
    - redis_web
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
    - backend
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 4096m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  notification-worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: service
      args:
        SERVICE_NAME: notification-service
    restart: unless-stopped
    environment:
      EDU_DB_USER: edu_notification
      EDU_REDIS_USERNAME: edu_notification
      EDU_JWT_ACTIVE_KID: ${EDU_JWT_ACTIVE_KID:-edu-key-1}
    secrets:
    - source: db_notification
      target: db_password
    - source: redis_notification
      target: redis_password
    - jwt_public_keys
    - rate_key
    - automation_keys
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
    - backend
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    command:
    - python
    - -m
    - app.worker
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOGIN_SCHOOL_ID: ${EDU_LOGIN_SCHOOL_ID:-}
      WEB_ORIGINS: ${EDU_WEB_ORIGINS:-http://localhost:18088,http://127.0.0.1:18088}
      COOKIE_SECURE: ${EDU_COOKIE_SECURE:-false}
      REDIS_PASSWORD_FILE: /run/secrets/redis_web
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    secrets:
    - redis_web
    networks:
    - backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

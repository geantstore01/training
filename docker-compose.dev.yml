name: educapilote
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_DB: educapilote
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    command:
    - postgres
    - -c
    - max_connections=100
    - -c
    - shared_buffers=128MB
    - -c
    - password_encryption=scram-sha-256
    - -c
    - log_statement=none
    - -c
    - log_min_error_statement=panic
    - -c
    - log_parameter_max_length_on_error=0
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    secrets:
    - postgres_password
    - db_migrator
    - db_auth
    - db_user
    - db_class
    - db_curriculum
    - db_content
    - db_exercise
    - db_assessment
    - db_tutor
    - db_retrieval
    - db_speech
    - db_notification
    - db_analytics
    - db_admin
    - db_safety
    - db_ai_router
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d educapilote
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - backend
    shm_size: 256mb
    mem_limit: 768m
    cpus: 1.5
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    user: 999:999
    entrypoint:
    - /bin/sh
    - /etc/redis/start.sh
    volumes:
    - redis_data:/data
    - ./infra/redis/redis.conf:/etc/redis/redis.conf:ro
    - ./infra/redis/start.sh:/etc/redis/start.sh:ro
    secrets:
    - redis_password
    - redis_auth
    - redis_user
    - redis_safety
    - redis_curriculum
    - redis_content
    - redis_exercise
    - redis_assessment
    - redis_tutor
    - redis_retrieval
    - redis_ai-router
    - redis_class
    - redis_analytics
    - redis_admin
    - redis_speech
    - redis_notification
    - redis_web
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=4m
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q
        PONG
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - backend
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 320m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: migrate
    environment:
      EDU_DB_USER: edu_migrator
      EDU_DB_PASSWORD_FILE: /run/secrets/db_migrator
    secrets:
    - db_migrator
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - backend
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  auth-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: service
      args:
        SERVICE_NAME: auth-service
    restart: unless-stopped
    environment:
      EDU_DB_USER: edu_auth
      EDU_REDIS_USERNAME: edu_auth
      EDU_JWT_ACTIVE_KID: ${EDU_JWT_ACTIVE_KID:-edu-key-1}
    secrets:
    - source: db_auth
      target: db_password
    - source: redis_auth
      target: redis_password
    - jwt_public_keys
    - rate_key
    - jwt_private_key
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
    - backend
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',
        timeout=8)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:

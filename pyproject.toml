[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "educapilote-infrastructure"
version = "0.8.0"
requires-python = ">=3.11"
description = "Socle ÉDUCAPILOTE CM1-CM2"
dependencies = [
  "SQLAlchemy>=2.0.43,<2.1", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<0.5", "pydantic>=2.11,<3", "pydantic-settings>=2.10,<3",
  "fastapi>=0.116,<1", "uvicorn>=0.35,<1", "redis>=6.4,<7",
  "PyJWT[crypto]>=2.10,<3", "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3",
  "httpx>=0.28,<1", "pypdf>=6,<7", "prometheus-client==0.26.0", "sentry-sdk==2.69.1"
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "httpx>=0.28,<1", "PyYAML>=6,<7"]
safety = ["spacy>=3.8,<3.9"]

[tool.setuptools.packages.find]
include = ["shared*"]

[tool.setuptools.package-data]
"shared.exercises" = ["data/*.json", "data/LICENSE-*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: PostgreSQL réel avec rôles, RLS et pgvector"]

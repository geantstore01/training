groups:
- name: educapilote
  rules:
  - alert: ServiceUnavailable
    expr: up{job="educapilote"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Microservice inaccessible
  - alert: ElevatedErrors
    expr: sum by(service)(rate(edu_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum
      by(service)(rate(edu_http_requests_total[5m])), 0.001) > 0.05
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Plus de 5 % de réponses 5xx
  - alert: SlowAPI
    expr: histogram_quantile(0.95,sum by(le,service)(rate(edu_http_duration_seconds_bucket{route!~"/health/.*"}[5m])))
      > 5
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Latence p95 supérieure à 5 secondes
  - alert: DiskLow
    expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes
      < 0.15
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Moins de 15 % de disque libre
  - alert: BackupStale
    expr: time() - edu_backup_last_success_timestamp_seconds > 93600
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Sauvegarde absente depuis 26 heures
  - alert: BackupMetricMissing
    expr: absent(edu_backup_last_success_timestamp_seconds)
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Métrique de sauvegarde absente
  - alert: HostMetricsStale
    expr: time() - edu_host_metrics_timestamp_seconds > 180
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Collecte GPU/sauvegardes périmée
  - alert: MemoryHigh
    expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Mémoire utilisée supérieure à 90 %
  - alert: DependencyUnavailable
    expr: edu_dependency_up == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: PostgreSQL ou Redis indisponible pour un service

    }
    location = /services/ai-router-service/metrics { return 404; }
    location / {
      set $web "web:3000";
      proxy_pass http://$web;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
    }
  }
}

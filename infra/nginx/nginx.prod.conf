worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;
  limit_req_zone $binary_remote_addr zone=requests:10m rate=10r/s;
  server {
    listen 8080;
    listen 8443 ssl;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location = /health/live { default_type application/json; return 200 '{"status":"ok"}'; }
    location /services/auth-service/ {
      limit_req zone=requests burst=30 nodelay;
      set $upstream "auth-service:8000";
      rewrite ^/services/auth-service/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 120s;
    }
    location = /services/auth-service/metrics { return 404; }
    location /services/user-service/ {
      limit_req zone=requests burst=30 nodelay;
      set $upstream "user-service:8000";
      rewrite ^/services/user-service/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 120s;
    }
    location = /services/user-service/metrics { return 404; }
    location /services/class-service/ {
      limit_req zone=requests burst=30 nodelay;
      set $upstream "class-service:8000";
      rewrite ^/services/class-service/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 120s;
    }
    location = /services/class-service/metrics { return 404; }
    location /services/curriculum-service/ {
      limit_req zone=requests burst=30 nodelay;
      set $upstream "curriculum-service:8000";
      rewrite ^/services/curriculum-service/(.*)$ /$1 break;
